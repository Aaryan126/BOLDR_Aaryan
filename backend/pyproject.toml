[project]
name = "boldr-revenue-rocket-backend"
version = "0.1.0"
description = "FastAPI backend for the BOLDR Revenue Rocket customer intelligence workbench."
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0,<0.200.0",
    "pydantic-settings>=2.8.0,<3.0.0",
    "uvicorn[standard]>=0.34.0,<0.40.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
